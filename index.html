<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChatUZB</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --ink: #f3f6fb;
      --muted: #a9b4c4;
      --line: #2a3140;
      --card: #1b1f27;
      --blue: #2f7cf6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at 50% 75%, #12305f 0%, #05070d 42%, #000 70%);
      color: var(--ink);
    }
    button, input, textarea {
      font: inherit; color: inherit;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }
    button:focus, button:focus-visible, button:active,
    input:focus, input:focus-visible, textarea:focus {
      outline: none;
      box-shadow: none;
    }
    .app { height: 100%; display: flex; flex-direction: column; }
    header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
    }
    .iconbtn, .send, .plus, .close-x {
      width: 42px; height: 42px; border: 0; border-radius: 50%;
      background: transparent; color: white; display: grid; place-items: center; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .plus:focus, .plus:active, .iconbtn:focus, .iconbtn:active, .close-x:focus, .close-x:active {
      background: transparent;
      outline: none;
    }
    .title { font-size: 20px; font-weight: 650; }
    .spacer { flex: 1; }
    .account {
      max-width: 42vw; border: 0; background: #20242d; color: white;
      border-radius: 999px; padding: 8px 12px; cursor: pointer;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    main { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 8px; }
    .empty {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 14px; padding: 12px;
    }
    .star {
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #7dffb2 0%, #1aa35a 38%, #1d6fe8 72%, #0b2f73 100%);
      box-shadow: 0 0 24px rgba(47, 124, 246, .45);
    }
    .empty h2 { margin: 0; font-size: 28px; font-weight: 500; line-height: 1.25; }
    .empty p { margin: 0; color: var(--muted); max-width: 420px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
    .chips button {
      border: 1px solid var(--line); background: #171b22; color: white;
      border-radius: 999px; padding: 10px 14px; cursor: pointer;
    }
    .msgs { display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: min(86%, 560px); padding: 12px 14px; border-radius: 18px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bot { background: #171b22; align-self: flex-start; }
    .user { background: var(--blue); align-self: flex-end; }
    .dock { padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); position: relative; }
    .composer {
      display: flex; align-items: center; gap: 4px;
      background: #1c212b; border-radius: 30px; min-height: 60px; padding: 6px;
    }
    .composer input {
      flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
      font-size: 16px; padding: 0 6px;
    }
    .plus { width: 48px; height: 48px; font-size: 32px; line-height: 1; }
    .send { width: 48px; height: 48px; background: var(--blue); padding: 0; }
    .send svg { width: 28px; height: 28px; display: block; }
    .menu {
      position: absolute; z-index: 4; left: 18px; bottom: 82px; width: 190px; padding: 8px;
      background: #11141a; border: 1px solid var(--line); border-radius: 18px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .menu button { border: 0; background: transparent; text-align: left; padding: 12px; border-radius: 12px; cursor: pointer; }
    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 6;
    }
    .drawer {
      position: fixed; inset: 0 auto 0 0; width: min(86vw, 360px); z-index: 7;
      background: #000; border-right: 1px solid #1c2230;
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 6px;
    }
    .drawer-head {
      display: flex; align-items: center; gap: 8px; min-height: 48px;
    }
    .drawer-head strong { font-size: 22px; font-weight: 650; }
    .close-x { margin-left: auto; font-size: 26px; }
    .navbtn, .newchat, .search {
      border: 0; background: transparent; color: white; text-align: left;
      border-radius: 999px; padding: 12px 14px; cursor: pointer;
    }
    .newchat { background: #20242d; display: flex; align-items: center; gap: 10px; font-size: 16px; }
    .navbtn { display: flex; align-items: center; gap: 12px; border-radius: 12px; }
    .navbtn:hover, .chat-item:hover, .note-item:hover { background: #171b22; }
    .section-label { color: #8b95a7; font-size: 14px; padding: 14px 14px 4px; }
    .list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
    .chat-item, .note-item {
      border: 0; background: transparent; color: white; text-align: left;
      padding: 12px 14px; border-radius: 12px; cursor: pointer;
    }
    .chat-row {
      display: flex; align-items: center; gap: 2px; border-radius: 12px;
    }
    .chat-row.active { background: #20242d; }
    .chat-row .chat-item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini {
      width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent;
      color: #c5cedb; cursor: pointer; flex: none;
    }
    .mini.danger { color: #ff8d8d; }
    .chat-item.active, .note-item.active { background: #20242d; }
    .sub { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
    .gate {
      position: fixed; inset: 0; background: rgba(0,0,0,.72);
      display: grid; place-items: center; padding: 18px; z-index: 8;
      overflow-y: auto;
    }
    .card {
      width: min(420px, 100%); background: #12161d; border-radius: 22px; padding: 20px;
      max-height: calc(100dvh - 36px); overflow-y: auto;
    }
    .card h2 { margin: 0 0 8px; }
    .card p { color: var(--muted); margin: 0; }
    .card input, .card button { width: 100%; margin-top: 10px; }
    .card input, .note-editor textarea {
      border-radius: 14px; border: 1px solid var(--line); background: #0d1016; padding: 12px;
    }
    .card input { height: 48px; }
    .card input, .card button, .gate button, .gate input {
      outline: none; box-shadow: none; -webkit-appearance: none; appearance: none;
    }
    .card input:focus, .card button:focus, .card button:active, .gate button:focus {
      outline: none; box-shadow: none; border-color: var(--line);
    }
    .card .solid { height: 46px; border: 0; border-radius: 999px; background: var(--blue); cursor: pointer; }
    .card .google { height: 46px; border-radius: 999px; border: 1px solid var(--line); background: #0d1016; cursor: pointer; }
    .note-editor { display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
    .note-editor textarea { min-height: 240px; resize: vertical; outline: none; }
    .row { display: flex; gap: 8px; }
    .row button { border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; }
    .save-note { background: var(--blue); }
    .back-note { background: #20242d; }
    .keybox { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .keybox .search { width: 100%; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Menyu">☰</button>
      <div class="title">ChatUZB</div>
      <div class="spacer"></div>
      <button class="account" id="accountBtn" type="button">Akunt</button>
    </header>
    <main id="chat"></main>
    <div class="dock">
      <form class="composer" id="form">
        <button class="plus" id="plusBtn" type="button" aria-label="Qo‘shish">+</button>
        <input id="text" type="text" placeholder="ChatUZB dan so‘rang" autocomplete="off" enterkeyhint="send">
        <button class="send" type="submit" aria-label="Yuborish">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg>
        </button>
      </form>
      <div class="menu hidden" id="plusMenu">
        <button type="button" id="camBtn">Kamera</button>
        <button type="button" id="galBtn">Galereya</button>
        <button type="button" id="fileBtn">Fayllar</button>
      </div>
    </div>
  </div>
  <div class="backdrop hidden" id="backdrop"></div>
  <aside class="drawer hidden" id="drawer" aria-label="Yon oyna">
    <div class="drawer-head">
      <strong>ChatUZB</strong>
      <button class="close-x" id="closeDrawer" type="button" aria-label="Yon oynani yopish">×</button>
    </div>
    <button class="newchat" id="newChat" type="button">✎ Yangi chat</button>
    <button class="navbtn" id="focusSearch" type="button">⌕ Chatlarni qidirish</button>
    <button class="navbtn" id="studentsBtn" type="button">🎓 Students</button>
    <button class="navbtn" id="libraryBtn" type="button">▤ Kutubxona</button>
    <div class="section-label">Daftarlar</div>
    <button class="navbtn" id="newNotebook" type="button">+ Yangi daftar</button>
    <div class="list" id="noteList"></div>
    <div class="section-label">Barcha chatlar</div>
    <input class="search" id="search" type="text" placeholder="Chatlarni qidirish">
    <div class="list" id="chatList"></div>
    <div class="keybox">
      <div class="section-label">Yashirin AI manzil</div>
      <input class="search" id="proxyUrl" type="text" placeholder="https://...workers.dev" autocomplete="off">
      <button class="navbtn" id="saveProxy" type="button">Manzilni saqlash</button>
    </div>
  </aside>
  <section class="gate" id="gate">
    <div class="card">
      <h2>Ro‘yxatdan o‘tish</h2>
      <p>ChatUZB o‘quvchilarga yordam beradi. Ismingizni yozing.</p>
      <form id="accountForm">
        <input id="name" type="text" maxlength="24" placeholder="Ismingiz">
        <button class="solid" type="submit">Ro‘yxatdan o‘tish</button>
      </form>
      <button class="google" id="googleBtn" type="button">Google akunt</button>
      <div id="accounts"></div>
    </div>
  </section>
  <input id="camInput" class="hidden" type="file" accept="image/*" capture="environment">
  <input id="galInput" class="hidden" type="file" accept="image/*">
  <input id="fileInput" class="hidden" type="file">
  <script>
    const KEY = "chatuzb-data";
    const gate = document.getElementById("gate");
    const chat = document.getElementById("chat");
    const chatList = document.getElementById("chatList");
    const noteList = document.getElementById("noteList");
    const text = document.getElementById("text");
    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("backdrop");
    const plusMenu = document.getElementById("plusMenu");
    const subjects = ["Matematika", "Ona tili", "Ingliz tili", "Tarix", "Biologiya", "Fizika"];
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || { accounts: [], current: "" }; }
      catch (e) { return { accounts: [], current: "" }; }
    }
    function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
    function account() {
      const data = load();
      return data.accounts.find(function (item) { return item.name === data.current; });
    }
    function ensure(user) {
      if (!user.chats) user.chats = [];
      if (!user.notebooks) user.notebooks = [];
      if (!user.active) user.active = user.chats[0] ? user.chats[0].id : "";
      if (!user.mode) user.mode = "chat";
      if (!user.openNote) user.openNote = "";
    }
    function welcomeText() { return "Qanday yordam bera olaman?"; }
    function closeDrawer() {
      drawer.classList.add("hidden");
      backdrop.classList.add("hidden");
    }
    function openDrawer() {
      drawer.classList.remove("hidden");
      backdrop.classList.remove("hidden");
      document.getElementById("proxyUrl").value = load().proxyUrl || "";
      drawList();
    }
    function askGemini(messages, apiKey) {
      const clean = messages.filter(function (msg) {
        return msg.text && msg.text.indexOf("O‘ylayapti") !== 0 && msg.text !== "Yozilmoqda...";
      }).map(function (msg) { return { role: msg.role, text: msg.text }; });
      const proxy = (load().proxyUrl || "").trim();
      if (proxy) {
        return fetch(proxy, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: clean })
        }).then(function (res) {
          return res.json().then(function (body) {
            if (!res.ok || !body.text) throw new Error((body && body.text) || "Yashirin manzil javob bermadi");
            return body.text;
          });
        });
      }
      const contents = clean.map(function (msg) {
        return { role: msg.role === "bot" ? "model" : "user", parts: [{ text: msg.text }] };
      });
      const models = ["gemini-3.5-flash", "gemini-3.1-flash-lite", "gemini-flash-latest", "gemini-3.8-flash"];
      function once(model) {
        const controller = new AbortController();
        const timer = setTimeout(function () { controller.abort(); }, 25000);
        return fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(apiKey), {
          method: "POST",
          signal: controller.signal,
          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: "Sen ChatUZB yordamchisisan. Savollarga oddiy, hurmatli va tushunarli o‘zbek tilida javob ber. Dars mavzularini qisqa tushuntir." }] },
            contents: contents
          })
        }).then(function (res) {
          clearTimeout(timer);
          return res.json().then(function (body) {
            if (!res.ok) {
              const message = (body.error && body.error.message) || "Gemini javob bermadi";
              const error = new Error(message);
              error.status = res.status;
              throw error;
            }
            const parts = body.candidates && body.candidates[0] && body.candidates[0].content && body.candidates[0].content.parts;
            const reply = parts && parts.map(function (part) { return part.text || ""; }).join("").trim();
            if (!reply) throw new Error("Javob bo‘sh keldi");
            return reply;
          });
        }).catch(function (err) {
          clearTimeout(timer);
          throw err;
        });
      }
      function tryNext(index, lastError) {
        if (index >= models.length) {
          const raw = lastError && lastError.message ? lastError.message : "noma’lum xato";
          if (raw === "Failed to fetch" || raw === "Load failed" || (lastError && lastError.name === "TypeError")) {
            throw new Error("Brauzer so‘rovni to‘sdi. Faylni content:// yoki yuklangan fayl sifatida ochmang. HTML ni oddiy saytga qo‘yib, https manzildan oching.");
          }
          throw new Error(raw);
        }
        return once(models[index]).catch(function (err) {
          if (err && (err.status === 404 || err.status === 400)) return tryNext(index + 1, err);
          throw err;
        });
      }
      return tryNext(0);
    }
    function enter(name) {
      const clean = name.trim();
      if (!clean) return;
      const data = load();
      if (!data.accounts.some(function (item) { return item.name === clean; })) {
        data.accounts.push({
          name: clean,
          active: "1",
          mode: "chat",
          openNote: "",
          chats: [{ id: "1", title: "Yangi chat", messages: [] }],
          notebooks: []
        });
      }
      data.current = clean;
      save(data);
      document.getElementById("name").value = "";
      openApp();
    }
    function showGate() {
      const data = load();
      gate.classList.remove("hidden");
      document.getElementById("accounts").innerHTML = "";
      data.accounts.forEach(function (item) {
        const btn = document.createElement("button");
        btn.className = "google";
        btn.type = "button";
        btn.textContent = item.name + " — kirish";
        btn.onclick = function () { enter(item.name); };
        document.getElementById("accounts").appendChild(btn);
      });
    }
    function askSubject(subject) {
      text.value = subject + " fanidan yordam kerak. Mavzuni oddiy tushuntir.";
      text.focus();
    }
    function drawMessages() {
      const user = account();
      ensure(user);
      chat.innerHTML = "";
      if (user.mode === "students") {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = '<div class="star"></div><h2>Students</h2><p>ChatUZB o‘quvchilarga dars, uy vazifasi va mavzuni tushunishda yordam beradi. Fanni tanlang.</p>';
        const chips = document.createElement("div");
        chips.className = "chips";
        subjects.forEach(function (subject) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = subject;
          btn.onclick = function () { askSubject(subject); };
          chips.appendChild(btn);
        });
        empty.appendChild(chips);
        chat.appendChild(empty);
        return;
      }
      if (user.mode === "library") {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = '<div class="star"></div><h2>Kutubxona</h2><p>Saqlangan daftarlaringiz shu yerda. Yangi daftar yon oynadan ochiladi.</p>';
        chat.appendChild(empty);
        return;
      }
      if (user.mode === "note") {
        const note = user.notebooks.find(function (item) { return item.id === user.openNote; });
        if (!note) { user.mode = "chat"; save(load()); drawMessages(); return; }
        const box = document.createElement("div");
        box.className = "note-editor";
        box.innerHTML = '<h2>' + note.title + '</h2><textarea id="noteBody" placeholder="Dars eslatmasi, formula yoki uy vazifasi..."></textarea><div class="row"><button class="back-note" id="backChat" type="button">Chatga qaytish</button><button class="save-note" id="saveNote" type="button">Saqlash</button></div>';
        chat.appendChild(box);
        document.getElementById("noteBody").value = note.body || "";
        document.getElementById("backChat").onclick = function () {
          const data = load();
          const current = data.accounts.find(function (item) { return item.name === data.current; });
          current.mode = "chat";
          save(data);
          drawMessages();
        };
        document.getElementById("saveNote").onclick = function () {
          const data = load();
          const current = data.accounts.find(function (item) { return item.name === data.current; });
          const item = current.notebooks.find(function (n) { return n.id === current.openNote; });
          item.body = document.getElementById("noteBody").value;
          save(data);
        };
        return;
      }
      const current = user.chats.find(function (item) { return item.id === user.active; });
      if (!current || !current.messages.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = '<div class="star"></div><h2>' + welcomeText() + '</h2>';
        chat.appendChild(empty);
        return;
      }
      const wrap = document.createElement("div");
      wrap.className = "msgs";
      current.messages.forEach(function (msg) {
        const div = document.createElement("div");
        div.className = "msg " + msg.role;
        div.textContent = msg.text;
        wrap.appendChild(div);
      });
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }
    function drawList() {
      const user = account();
      if (!user) return;
      ensure(user);
      const q = document.getElementById("search").value.toLowerCase();
      chatList.innerHTML = "";
      noteList.innerHTML = "";
      user.notebooks.slice().reverse().forEach(function (item) {
        const btn = document.createElement("button");
        btn.className = "note-item" + (user.mode === "note" && item.id === user.openNote ? " active" : "");
        btn.type = "button";
        btn.textContent = item.title;
        btn.onclick = function () {
          const data = load();
          const current = data.accounts.find(function (acc) { return acc.name === data.current; });
          current.mode = "note";
          current.openNote = item.id;
          save(data);
          closeDrawer();
          drawMessages();
        };
        noteList.appendChild(btn);
      });
      user.chats.slice().reverse().forEach(function (item) {
        if (q && item.title.toLowerCase().indexOf(q) === -1) return;
        const row = document.createElement("div");
        row.className = "chat-row" + (user.mode === "chat" && item.id === user.active ? " active" : "");
        const btn = document.createElement("button");
        btn.className = "chat-item";
        btn.type = "button";
        btn.textContent = item.title;
        btn.onclick = function () {
          const data = load();
          const current = data.accounts.find(function (acc) { return acc.name === data.current; });
          current.active = item.id;
          current.mode = "chat";
          save(data);
          closeDrawer();
          drawList();
          drawMessages();
        };
        const rename = document.createElement("button");
        rename.className = "mini";
        rename.type = "button";
        rename.textContent = "✎";
        rename.setAttribute("aria-label", "Nomini o‘zgartirish");
        rename.onclick = function (e) {
          e.stopPropagation();
          const next = window.prompt("Chat nomi", item.title);
          if (!next || !next.trim()) return;
          const data = load();
          const current = data.accounts.find(function (acc) { return acc.name === data.current; });
          const chatItem = current.chats.find(function (c) { return c.id === item.id; });
          chatItem.title = next.trim().slice(0, 40);
          save(data);
          drawList();
        };
        const remove = document.createElement("button");
        remove.className = "mini danger";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Chatni o‘chirish");
        remove.onclick = function (e) {
          e.stopPropagation();
          if (!window.confirm("Bu chat o‘chirilsinmi?")) return;
          const data = load();
          const current = data.accounts.find(function (acc) { return acc.name === data.current; });
          current.chats = current.chats.filter(function (c) { return c.id !== item.id; });
          if (!current.chats.length) {
            const id = String(Date.now());
            current.chats.push({ id: id, title: "Yangi chat", messages: [] });
            current.active = id;
          } else if (current.active === item.id) {
            current.active = current.chats[current.chats.length - 1].id;
          }
          current.mode = "chat";
          save(data);
          drawList();
          drawMessages();
        };
        row.appendChild(btn);
        row.appendChild(rename);
        row.appendChild(remove);
        chatList.appendChild(row);
      });
    }
    function openApp() {
      gate.classList.add("hidden");
      const user = account();
      ensure(user);
      document.getElementById("accountBtn").textContent = user.name;
      drawList();
      drawMessages();
    }
    function addNote(label, file) {
      const data = load();
      const user = data.accounts.find(function (item) { return item.name === data.current; });
      ensure(user);
      user.mode = "chat";
      const current = user.chats.find(function (item) { return item.id === user.active; });
      current.messages.push({ role: "user", text: label + ": " + ((file && file.name) || "tanlanmadi") });
      current.messages.push({ role: "bot", text: label + " qabul qilindi. Hozircha faqat nomi saqlanadi." });
      if (current.title === "Yangi chat") current.title = label;
      save(data);
      plusMenu.classList.add("hidden");
      drawList();
      drawMessages();
    }
    document.getElementById("accountForm").onsubmit = function (e) { e.preventDefault(); enter(document.getElementById("name").value); };
    document.getElementById("googleBtn").onclick = function () { enter(document.getElementById("name").value.trim() || "Google foydalanuvchi"); };
    document.getElementById("newChat").onclick = function () {
      const data = load();
      const user = data.accounts.find(function (item) { return item.name === data.current; });
      const id = String(Date.now());
      user.chats.push({ id: id, title: "Yangi chat", messages: [] });
      user.active = id;
      user.mode = "chat";
      save(data);
      closeDrawer();
      drawList();
      drawMessages();
    };
    document.getElementById("studentsBtn").onclick = function () {
      const data = load();
      const user = data.accounts.find(function (item) { return item.name === data.current; });
      user.mode = "students";
      save(data);
      closeDrawer();
      drawMessages();
    };
    document.getElementById("libraryBtn").onclick = function () {
      const data = load();
      const user = data.accounts.find(function (item) { return item.name === data.current; });
      user.mode = "library";
      save(data);
      closeDrawer();
      drawMessages();
    };
    document.getElementById("newNotebook").onclick = function () {
      const title = window.prompt("Daftar nomi", "Yangi daftar");
      if (!title || !title.trim()) return;
      const data = load();
      const user = data.accounts.find(function (item) { return item.name === data.current; });
      ensure(user);
      const id = "n" + Date.now();
      user.notebooks.push({ id: id, title: title.trim().slice(0, 40), body: "" });
      user.mode = "note";
      user.openNote = id;
      save(data);
      closeDrawer();
      drawList();
      drawMessages();
    };
    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      const question = text.value.trim();
      if (!question) return;
      const data = load();
      const user = data.accounts.find(function (item) { return item.name === data.current; });
      ensure(user);
      user.mode = "chat";
      let current = user.chats.find(function (item) { return item.id === user.active; });
      if (!current) {
        current = { id: String(Date.now()), title: "Yangi chat", messages: [] };
        user.chats.push(current);
        user.active = current.id;
      }
      current.messages.push({ role: "user", text: question });
      if (current.title === "Yangi chat") current.title = question.slice(0, 32);
      const apiKey = data.geminiKey || "";
      const proxy = data.proxyUrl || "";
      const started = Date.now();
      const pending = (apiKey || proxy) ? "O‘ylayapti · 0.0 s" : "AI manzili yo‘q. Yon oynaga yashirin manzilni qo‘ying.";
      current.messages.push({ role: "bot", text: pending });
      const chatId = current.id;
      save(data);
      text.value = "";
      plusMenu.classList.add("hidden");
      drawList();
      drawMessages();
      if (!apiKey && !proxy) return;
      const timer = setInterval(function () {
        const fresh = load();
        const person = fresh.accounts.find(function (item) { return item.name === fresh.current; });
        if (!person) return;
        const thread = person.chats.find(function (item) { return item.id === chatId; });
        const last = thread && thread.messages[thread.messages.length - 1];
        if (!last || last.text.indexOf("O‘ylayapti") !== 0) return;
        last.text = "O‘ylayapti · " + ((Date.now() - started) / 1000).toFixed(1) + " s";
        save(fresh);
        if (person.mode === "chat" && person.active === chatId) drawMessages();
      }, 200);
      function finish(text) {
        clearInterval(timer);
        const fresh = load();
        const person = fresh.accounts.find(function (item) { return item.name === fresh.current; });
        const thread = person.chats.find(function (item) { return item.id === chatId; });
        const last = thread.messages[thread.messages.length - 1];
        const took = ((Date.now() - started) / 1000).toFixed(1) + " s";
        if (last && last.role === "bot") last.text = text + "\n\nJavob vaqti: " + took;
        save(fresh);
        drawMessages();
      }
      askGemini(current.messages.slice(0, -1), apiKey).then(function (reply) {
        finish(reply);
      }).catch(function (err) {
        finish("Gemini ulanmadi: " + err.message);
      });
    };
    document.getElementById("plusBtn").onclick = function () { plusMenu.classList.toggle("hidden"); };
    document.getElementById("camBtn").onclick = function () { document.getElementById("camInput").click(); };
    document.getElementById("galBtn").onclick = function () { document.getElementById("galInput").click(); };
    document.getElementById("fileBtn").onclick = function () { document.getElementById("fileInput").click(); };
    document.getElementById("camInput").onchange = function (e) { addNote("Kamera", e.target.files[0]); };
    document.getElementById("galInput").onchange = function (e) { addNote("Galereya", e.target.files[0]); };
    document.getElementById("fileInput").onchange = function (e) { addNote("Fayllar", e.target.files[0]); };
    document.getElementById("saveProxy").onclick = function () {
      const data = load();
      data.proxyUrl = document.getElementById("proxyUrl").value.trim();
      save(data);
      document.getElementById("saveProxy").textContent = data.proxyUrl ? "Saqlandi" : "Manzilni saqlash";
    };
    document.getElementById("menuBtn").onclick = function () { openDrawer(); };
    document.getElementById("closeDrawer").onclick = closeDrawer;
    document.getElementById("backdrop").onclick = closeDrawer;
    document.getElementById("focusSearch").onclick = function () { document.getElementById("search").focus(); };
    document.getElementById("accountBtn").onclick = function () { const data = load(); data.current = ""; save(data); closeDrawer(); showGate(); };
    document.getElementById("search").oninput = drawList;
    if (load().current && account()) openApp(); else showGate();
  </script>
</body>
</html>
